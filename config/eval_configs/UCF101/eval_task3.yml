model:
  model_name: csta
  dim: 768
  num_heads: 12
  num_layers: 12

data:
  dataset_name: ucf101
  num_frames: 8
  img_size: 224
  num_channels: 3
  patch_size: 16
  root_dir: DATA/UCF101
  label2id_path: DATA/UCF101/tasks/label2id.json
  task_0:
    train_csv: DATA/UCF101/tasks/task_0/train.csv
    test_csv: DATA/UCF101/tasks/task_0/test.csv
    valid_csv: DATA/UCF101/tasks/task_0/val.csv
  task_1:
    train_csv: DATA/UCF101/tasks/task_1/train.csv
    test_csv: DATA/UCF101/tasks/task_1/test.csv
    valid_csv: DATA/UCF101/tasks/task_1/val.csv
  task_2:
    train_csv: DATA/UCF101/tasks/task_2/train.csv
    test_csv: DATA/UCF101/tasks/task_2/test.csv
    valid_csv: DATA/UCF101/tasks/task_2/val.csv
  task_3:
    train_csv: DATA/UCF101/tasks/task_3/train.csv
    test_csv: DATA/UCF101/tasks/task_3/test.csv
    valid_csv: DATA/UCF101/tasks/task_3/val.csv

loss:
  calculate_distil_loss: False
  calculate_lt_ls_loss: False
  count_relations: False
  miu_d: 0.8
  miu_t: 0.3
  miu_s: 0.3
  lambda_1: 0.3
  lambda_2: 0.3
  K: 5
  temporal_features_path: model_save/pretrained/bank/task_2_model/temporal_feats_task1.pt
  spatial_features_path: model_save/pretrained/bank/task_2_model/spatial_feats_task1.pt
  temporal_relations_path: model_save/pretrained/bank/task_2_model/temporal_relations_task1.json
  spatial_relations_path: model_save/pretrained/bank/task_2_model/spatial_relations_task1.json

task:
  task_n: 3
  init_with_adapters: False
  num_classes_t0: 51
  num_classes_new: 5

eval:
  random_seed: 42
  test_batch_size: 16
  dataloader_num_workers: 4
  dataloader_pin_memory: False
  dataloader_persistent_workers: False

checkpoints:
  current_config: model_save/pretrained/ucf101/task_3/config/train_config.yml
  current_checkpoint: model_save/pretrained/ucf101/task_3/model/checkpoints/final_model_after_ft.pth