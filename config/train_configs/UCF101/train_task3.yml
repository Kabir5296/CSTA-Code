model:
  model_name: csta
  dim: 768
  num_heads: 12
  num_layers: 12

data:
  dataset_name: ucf101
  num_frames: 8
  img_size: 224
  num_channels: 3
  patch_size: 16
  root_dir: DATA/UCF101
  train_csv: DATA/UCF101/tasks/task_3/train.csv
  test_csv: DATA/UCF101/tasks/task_3/test.csv
  valid_csv: DATA/UCF101/tasks/task_3/val.csv
  label2id_path: DATA/UCF101/tasks/label2id.json

loss:
  calculate_distil_loss: True
  calculate_lt_ls_loss: True
  count_relations: True
  miu_d: 0.8
  miu_t: 0.3
  miu_s: 0.3
  lambda_1: 0.3
  lambda_2: 0.3
  K: 5
  temporal_features_path: model_save/pretrained/bank/task_2_model/temporal_feats_task2.pt
  spatial_features_path: model_save/pretrained/bank/task_2_model/spatial_feats_task2.pt
  temporal_relations_path: model_save/pretrained/bank/task_2_model/temporal_relations_task2.json
  spatial_relations_path: model_save/pretrained/bank/task_2_model/spatial_relations_task2.json
  memory_bandk_dir: model_save/pretrained/bank/task_3_model/

task:
  task_n: 3
  init_with_adapters: False
  num_classes_t0: 51
  num_classes_new: 5

train:
  random_seed: 42
  num_training_epochs: 10
  training_batch_size: 8
  evaluation_batch_size: 8
  dataloader_num_workers: 4
  dataloader_pin_memory: False
  dataloader_persistent_workers: False
  learning_rate: 2e-4
  weight_decay: 1e-4
  eta_min: 1e-10
  grad_acc: 8
  warmup_epochs: 3
  max_grad: 2.5
  early_stop_patience: 4

checkpoints:
  old_config_path: model_save/pretrained/ucf101/task_2/config/train_config.yml
  old_checkpoint: model_save/pretrained/ucf101/task_2/model/checkpoints/final_model_after_ft.pth

fine_tune:
  fine_tune: True
  train_data_0: DATA/UCF101/tasks/task_0/fine_tune.csv
  train_data_1: DATA/UCF101/tasks/task_1/fine_tune.csv
  train_data_2: DATA/UCF101/tasks/task_2/fine_tune.csv
  train_data_3: DATA/UCF101/tasks/task_3/fine_tune.csv
  task_n_ft: 2
  ft_learning_rate: 1e-5
  ft_weight_decay: 0.0
  ft_epochs: 8
